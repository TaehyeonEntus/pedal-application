<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Pedal App Home</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .container-main {
            min-height: 100vh;
            padding: 2rem 0;
        }

        .card {
            background: rgba(255,255,255,0.95);
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .card-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-radius: 20px 20px 0 0 !important;
            border: none;
            padding: 1.5rem;
            text-align: center;
            font-weight: bold;
        }

        .card-body {
            padding: 1.5rem;
        }

        .navbar {
            background: rgba(255,255,255,0.1) !important;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .navbar-brand, .nav-link {
            color: white !important;
            font-weight: 500;
        }

        .nav-link:hover {
            color: #f8f9fa !important;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .table th {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            font-weight: 600;
        }

        .table td {
            border-color: #e9ecef;
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background-color: rgba(102, 126, 234, 0.1);
            transform: scale(1.02);
            transition: all 0.2s ease;
        }

        .product-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .loading-spinner {
            text-align: center;
            margin: 2rem 0;
        }

        .error-message {
            color: #dc3545;
            text-align: center;
            margin: 1rem 0;
            padding: 1rem;
            background: rgba(220, 53, 69, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(220, 53, 69, 0.2);
        }

        .empty-message {
            color: #6c757d;
            text-align: center;
            font-style: italic;
        }

        footer {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: 3rem;
        }

        .section-title {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 1.5rem;
        }

        a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            color: #764ba2;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/home">
            <i class="fas fa-music me-2"></i>Pedal App
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/home"><i class="fas fa-home me-1"></i>Home</a>
            <a class="nav-link" href="/boards"><i class="fas fa-th-large me-1"></i>Pedal Boards</a>
            <a class="nav-link" href="/pedals"><i class="fas fa-sliders-h me-1"></i>Effect Pedals</a>
        </div>
    </div>
</nav>

<div class="container container-main">
    <div class="card">
        <div class="card-header">
            <i class="fas fa-th-large me-2"></i>🎛️ 최신 페달보드 20개
        </div>
        <div class="card-body">
            <div id="boards-loading" class="loading-spinner">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">페달보드 목록을 불러오는 중...</p>
            </div>
            <div id="boards-error" class="error-message" style="display: none;"></div>
            <div id="boards-table" style="display: none;">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>번호</th>
                            <th>이미지</th>
                            <th>이름</th>
                            <th>작성자</th>
                            <th>등록일</th>
                        </tr>
                        </thead>
                        <tbody id="boards"></tbody>
                    </table>
                </div>
                <div class="text-center">
                    <button class="btn btn-primary" onclick="window.location.href='/boards'" id="boards-more-btn">
                        <i class="fas fa-plus me-2"></i>페달보드 더보기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <i class="fas fa-sliders-h me-2"></i>🎚️ 최신 이펙터 페달 20개
        </div>
        <div class="card-body">
            <div id="pedals-loading" class="loading-spinner">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">이펙터 페달 목록을 불러오는 중...</p>
            </div>
            <div id="pedals-error" class="error-message" style="display: none;"></div>
            <div id="pedals-table" style="display: none;">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>번호</th>
                            <th>이미지</th>
                            <th>이름</th>
                            <th>카테고리</th>
                            <th>등록일</th>
                        </tr>
                        </thead>
                        <tbody id="pedals"></tbody>
                    </table>
                </div>
                <div class="text-center">
                    <button class="btn btn-primary" onclick="window.location.href='/pedals'" id="pedals-more-btn">
                        <i class="fas fa-plus me-2"></i>이펙터 페달 더보기
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>&copy; 2025 Pedal App. Made with ❤️</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { getData } from '/js/api.js';
    import { getImageUrl } from '/js/getImageUrl.js';

    // DOM 요소 참조
    const boardsLoading = document.getElementById('boards-loading');
    const boardsError = document.getElementById('boards-error');
    const boardsTable = document.getElementById('boards-table');
    const boardsTbody = document.getElementById('boards');

    const pedalsLoading = document.getElementById('pedals-loading');
    const pedalsError = document.getElementById('pedals-error');
    const pedalsTable = document.getElementById('pedals-table');
    const pedalsTbody = document.getElementById('pedals');

    async function loadHomeData() {
        try {
            // 로딩 스피너 표시
            showLoading();

            // API 데이터 가져오기
            const data = await getData('/api/home');

            if (!data) {
                throw new Error('홈 데이터를 불러오지 못했습니다.');
            }

            // 데이터 렌더링
            renderBoards(data.boards || []);
            renderPedals(data.pedals || []);

            // 성공 시 테이블과 버튼 표시
            showContent();

        } catch (err) {
            console.error('홈 데이터 로딩 실패:', err);
            showError(err.message || '데이터를 불러오는데 실패했습니다.');
        }
    }

    function showLoading() {
        boardsLoading.style.display = 'block';
        pedalsLoading.style.display = 'block';
        boardsError.style.display = 'none';
        pedalsError.style.display = 'none';
        boardsTable.style.display = 'none';
        pedalsTable.style.display = 'none';
    }

    function showContent() {
        boardsLoading.style.display = 'none';
        pedalsLoading.style.display = 'none';
        boardsError.style.display = 'none';
        pedalsError.style.display = 'none';
        boardsTable.style.display = 'block';
        pedalsTable.style.display = 'block';
    }

    function showError(errorMessage) {
        boardsLoading.style.display = 'none';
        pedalsLoading.style.display = 'none';
        boardsError.textContent = `보드 로딩 실패: ${errorMessage}`;
        pedalsError.textContent = `페달 로딩 실패: ${errorMessage}`;
        boardsError.style.display = 'block';
        pedalsError.style.display = 'block';
        boardsTable.style.display = 'none';
        pedalsTable.style.display = 'none';
    }

    function renderBoards(boards) {
        boardsTbody.innerHTML = '';

        if (boards.length === 0) {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td colspan="5" class="empty-message"><i class="fas fa-th-large me-2"></i>등록된 페달보드가 없습니다.</td>';
            boardsTbody.appendChild(tr);
            return;
        }

        boards.forEach((b, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${i + 1}</strong></td>
                <td><img src="${getImageUrl(b.boardImageUrl)}" alt="board image" class="product-img"></td>
                <td><a href="/board/${b.boardId}">${b.boardName}</a></td>
                <td>${b.boardOwner || '<span class="text-muted">-</span>'}</td>
                <td><small class="text-muted">${new Date(b.createdAt).toLocaleDateString()}</small></td>
            `;
            boardsTbody.appendChild(tr);
        });
    }

    function renderPedals(pedals) {
        pedalsTbody.innerHTML = '';

        if (pedals.length === 0) {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td colspan="6" class="empty-message"><i class="fas fa-guitar me-2"></i>등록된 페달이 없습니다.</td>';
            pedalsTbody.appendChild(tr);
            return;
        }

        pedals.forEach((p, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${i + 1}</strong></td>
                <td><img src="${getImageUrl(p.pedalImageUrl)}" alt="pedal image" class="product-img"></td>
                <td><strong>${p.pedalName}</strong></td>
                <td><span class="badge bg-primary">${p.categoryName}</span></td>
                <td><small class="text-muted">${new Date(p.createdAt).toLocaleDateString()}</small></td>
            `;
            pedalsTbody.appendChild(tr);
        });
    }

    // 페이지 로드 시 데이터 불러오기
    window.addEventListener('DOMContentLoaded', loadHomeData);
</script>
</body>
</html>
