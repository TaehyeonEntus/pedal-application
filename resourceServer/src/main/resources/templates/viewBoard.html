<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>보드 상세</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .board-header { display: flex; align-items: center; margin-bottom: 20px; }
        .board-header img { width: 200px; height: 200px; object-fit: cover; margin-right: 20px; }
        .board-info { display: flex; flex-direction: column; }
        .board-info h1 { margin: 0 0 10px 0; }
        .pedal-list { display: flex; flex-wrap: wrap; gap: 15px; }
        .pedal-item { width: 150px; text-align: center; }
        .pedal-item img { width: 150px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>

<div class="board-header">
    <img id="boardImage" src="/images/board_default.png" alt="Board Image">
    <div class="board-info">
        <h1 id="boardName">보드 이름</h1>
        <p>작성자: <span id="boardOwner"></span></p>
        <p id="boardDescription"></p>
    </div>
</div>

<hr>

<div class="pedal-list" id="pedalList">
    <!-- JS로 페달 아이템 추가 -->
</div>

<script type="module">
    import { loadProtectedData } from "/js/apiRequest.js";

    window.addEventListener('DOMContentLoaded', async () => {
        const boardId = getBoardIdFromPath();
        const boardData = await fetchBoardData(boardId);
        if (!boardData) return;

        renderBoardInfo(boardData);
        renderPedalList(boardId, boardData.pedals || []);
    });

    // URL에서 boardId 추출
    function getBoardIdFromPath() {
        const pathParts = window.location.pathname.split('/');
        return pathParts[pathParts.length - 1];
    }

    // API 요청
    async function fetchBoardData(boardId) {
        try {
            return await loadProtectedData(`/api/board/${boardId}`);
        } catch (err) {
            console.error("보드 데이터를 불러오지 못했습니다.", err);
            return null;
        }
    }

    // 페달 삭제
    async function deletePedal(boardId, pedalId) {
        try {
            const response = await fetch(`/api/board/${boardId}/delete`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include", // 쿠키 기반 인증
                body: JSON.stringify({ pedalId })
            });

            if (!response.ok) throw new Error("Delete failed");

            return await response.json();
        } catch (err) {
            console.error("deletePedal fail", err);
            return null;
        }
    }

    // 페달 이동
    async function movePedal(boardId, pedalId, destination) {
        try {
            const response = await fetch(`/api/board/${boardId}/move`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include", // 쿠키 기반 인증
                body: JSON.stringify({ pedalId, destination })
            });

            if (!response.ok) throw new Error("Move failed");

            return await response.json();
        } catch (err) {
            console.error("movePedal fail", err);
            return null;
        }
    }

    // 페달 스왑
    async function swapPedal(boardId, pedal1Id, pedal2Id) {
        try {
            const response = await fetch(`/api/board/${boardId}/swap`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include", // 쿠키 기반 인증
                body: JSON.stringify({ pedal1Id, pedal2Id })
            });

            if (!response.ok) throw new Error("Swap failed");

            return await response.json();
        } catch (err) {
            console.error("swapPedal fail", err);
            return null;
        }
    }


    // 보드 정보 렌더링
    function renderBoardInfo(board) {
        document.getElementById('boardName').textContent = board.boardName;
        document.getElementById('boardOwner').textContent = board.boardOwner;
        document.getElementById('boardDescription').textContent = board.boardDescription;
        document.getElementById('boardImage').src = board.boardImageUrl || '/images/board_default.png';
    }

    // renderPedalList 수정
    function renderPedalList(boardId, pedals) {
        const pedalList = document.getElementById('pedalList');
        pedalList.innerHTML = '';

        pedals.forEach((pedal, index) => {
            const div = document.createElement('div');
            div.className = 'pedal-item';
            div.innerHTML = `
            <img src="${pedal.pedalImageUrl || '/images/pedal_default.png'}" alt="Pedal Image">
            <p>${pedal.pedalName || '-'}</p>
            <p>${pedal.categoryName || '-'}</p>
            <button class="delete-btn">삭제</button>
            <button class="move-btn">이동</button>
            <button class="swap-btn">스왑</button>
        `;
            pedalList.appendChild(div);

            // 삭제 버튼
            div.querySelector('.delete-btn').addEventListener('click', async () => {
                if (!confirm(`"${pedal.pedalName}"를 삭제하시겠습니까?`)) return;
                const updatedBoard = await deletePedal(boardId, pedal.pedalId);
                if (updatedBoard) renderPedalList(boardId, updatedBoard.pedals);
            });

            // 이동 버튼
            div.querySelector('.move-btn').addEventListener('click', async () => {
                const destination = parseInt(prompt('몇 번째 위치로 이동하시겠습니까? (0부터 시작)'), 10);
                if (isNaN(destination) || destination < 0 || destination >= pedals.length) {
                    alert('잘못된 위치입니다.');
                    return;
                }
                const updatedBoard = await movePedal(boardId, pedal.pedalId, destination);
                if (updatedBoard) renderPedalList(boardId, updatedBoard.pedals);
            });

            // 스왑 버튼
            div.querySelector('.swap-btn').addEventListener('click', async () => {
                const otherIndex = parseInt(prompt('교체할 페달의 번호를 입력하세요 (0부터 시작)'), 10);
                if (isNaN(otherIndex) || otherIndex < 0 || otherIndex >= pedals.length || otherIndex === index) {
                    alert('잘못된 번호입니다.');
                    return;
                }
                const otherPedal = pedals[otherIndex];
                const updatedBoard = await swapPedal(boardId, pedal.pedalId, otherPedal.pedalId);
                if (updatedBoard) renderPedalList(boardId, updatedBoard.pedals);
            });

            // 화살표
            if (index < pedals.length - 1) {
                const arrow = document.createElement('span');
                arrow.textContent = '→';
                arrow.style.alignSelf = 'center';
                arrow.style.margin = '0 10px';
                pedalList.appendChild(arrow);
            }
        });
    }

</script>

</body>
</html>
