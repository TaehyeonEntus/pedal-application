<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>페달 상세</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .container-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 0;
            flex-direction: column;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            width: 100%;
            max-width: 900px; /* 카드 최대 너비 설정 */
        }

        .card-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-radius: 20px 20px 0 0 !important;
            border: none;
            padding: 1.5rem;
            text-align: center;
            font-weight: bold;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .navbar-brand, .nav-link {
            color: white !important;
            font-weight: 500;
        }

        .nav-link:hover {
            color: #f8f9fa !important;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .pedal-img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }

        .badge {
            font-size: 0.9rem;
        }

        .description-text {
            font-size: 1rem;
            white-space: pre-line;
            color: #555;
        }

        .loading-container, .error-container {
            text-align: center;
            padding: 4rem 0;
            color: #555;
        }

        .content-hidden {
            display: none;
        }

        footer {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/home">
            <i class="fas fa-music me-2"></i>Pedal App
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/home"><i class="fas fa-home me-1"></i>Home</a>
            <a class="nav-link" href="/boards"><i class="fas fa-th-large me-1"></i>Pedal Boards</a>
            <a class="nav-link" href="/pedals"><i class="fas fa-sliders-h me-1"></i>Effect Pedals</a>
        </div>
    </div>
</nav>

<div class="container container-main">
    <section id="pedalDetailCard" class="card">
        <div class="card-header">
            <i class="fas fa-info-circle me-2"></i>페달 상세 정보
        </div>
        <div class="card-body">
            <div id="loadingContainer" class="loading-container">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">페달 정보를 불러오는 중...</p>
            </div>
            <div id="errorContainer" class="error-container" style="display: none;"></div>

            <div id="pedalContent" class="d-flex flex-column flex-md-row align-items-center content-hidden">
            </div>
        </div>
    </section>
</div>

<footer>
    <p>&copy; 2025 Pedal App. Made with ❤️</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { getData } from "/js/api.js";
    import { getImageUrl } from "/js/getImageUrl.js";

    // DOM 요소
    const loadingContainerEl = document.getElementById("loadingContainer");
    const errorContainerEl = document.getElementById("errorContainer");
    const pedalContentEl = document.getElementById("pedalContent");

    window.addEventListener("DOMContentLoaded", async () => {
        const pedalId = getPedalIdFromPath();
        if (pedalId) {
            await loadPedalData(pedalId);
        } else {
            showError("페달 ID가 URL에 없습니다.");
        }
    });

    function getPedalIdFromPath() {
        const pathParts = window.location.pathname.split("/");
        return pathParts[pathParts.length - 1];
    }

    async function loadPedalData(pedalId) {
        try {
            showLoading();
            const data = await getData(`/api/pedal/${pedalId}`);
            if (data && data.pedalDetail) {
                renderPedalInfo(data.pedalDetail);
                showContent();
            } else {
                throw new Error("페달 데이터를 찾을 수 없습니다.");
            }
        } catch (err) {
            console.error("페달 데이터 로딩 실패:", err);
            showError(err.message || "데이터를 불러오는 중 오류가 발생했습니다.");
        }
    }

    function showLoading() {
        loadingContainerEl.style.display = "block";
        errorContainerEl.style.display = "none";
        pedalContentEl.classList.add("content-hidden");
    }

    function showContent() {
        loadingContainerEl.style.display = "none";
        errorContainerEl.style.display = "none";
        pedalContentEl.classList.remove("content-hidden");
    }

    function showError(message) {
        loadingContainerEl.style.display = "none";
        errorContainerEl.textContent = message;
        errorContainerEl.style.display = "block";
        pedalContentEl.classList.add("content-hidden");
    }

    function renderPedalInfo(pedal) {
        const pedalContentHtml = `
            <img alt="Pedal Image" class="pedal-img mb-3 me-md-4" src="${getImageUrl(pedal.pedalImageUrl) || 'https://via.placeholder.com/250'}">
            <div class="text-center text-md-start w-100">
                <h1 class="display-6 fw-bold mb-0">${pedal.pedalName || '이름 없음'}</h1>
                <div class="mt-2">
                    <span class="badge bg-success me-2">${pedal.pedalCategory?.name || "카테고리 없음"}</span>
                    <a href="${pedal.pedalBrand?.homepage || '#'}" target="_blank" class="text-decoration-none" id="brandLink">
                        <span class="badge bg-secondary">${pedal.pedalBrand?.name || "브랜드 없음"}</span>
                    </a>
                </div>
                <p class="description-text mt-4">${pedal.pedalDescription || "설명이 없습니다."}</p>
            </div>
        `;
        pedalContentEl.innerHTML = pedalContentHtml;

        const brandLinkEl = pedalContentEl.querySelector('#brandLink');
        if (!pedal.pedalBrand?.homepage) {
            brandLinkEl.style.pointerEvents = 'none';
            brandLinkEl.style.cursor = 'default';
        }
    }
</script>
</body>
</html>
