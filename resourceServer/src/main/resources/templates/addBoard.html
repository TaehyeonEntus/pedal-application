<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>보드 추가</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .container-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 0;
            flex-direction: column;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            width: 100%;
            max-width: 700px;
        }

        .card-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-radius: 20px 20px 0 0 !important;
            border: none;
            padding: 1.5rem;
            text-align: center;
            font-weight: bold;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .navbar-brand, .nav-link {
            color: white !important;
            font-weight: 500;
        }

        .nav-link:hover {
            color: #f8f9fa !important;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .loading-spinner, .error-message {
            text-align: center;
            margin: 2rem 0;
        }

        .image-preview-container {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1rem;
            transition: border-color 0.3s ease;
        }

        .image-preview-container.drag-over {
            border-color: #007bff; /* 드래그 오버 시 테두리 색상 변경 */
        }

        .image-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            display: none; /* 초기에는 숨김 */
        }

        footer {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/home">
            <i class="fas fa-music me-2"></i>Pedal App
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/home"><i class="fas fa-home me-1"></i>Home</a>
            <a class="nav-link" href="/boards"><i class="fas fa-th-large me-1"></i>Pedal Boards</a>
            <a class="nav-link" href="/pedals"><i class="fas fa-sliders-h me-1"></i>Effect Pedals</a>
        </div>
    </div>
</nav>

<div class="container container-main">
    <section class="card">
        <div class="card-header">
            <i class="fas fa-plus-circle me-2"></i>보드 추가
        </div>
        <div class="card-body">
            <form id="addBoardForm">
                <div class="mb-3">
                    <label for="name" class="form-label">보드 이름</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">보드 설명</label>
                    <textarea class="form-control" id="description" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">보드 이미지 (드래그 & 드롭 또는 클릭)</label>
                    <div id="imagePreviewContainer" class="image-preview-container">
                        <img id="imagePreview" src="#" alt="Image Preview" class="image-preview">
                        <p id="previewText" class="text-muted">
                            <i class="fas fa-cloud-upload-alt me-2"></i>파일을 여기에 끌어다 놓으세요
                            <br>
                            <span class="text-secondary">(또는 클릭하여 업로드)</span>
                        </p>
                    </div>
                    <input type="file" class="form-control" id="image" accept="image/*" style="display: none;">
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-save me-2"></i>보드 생성하기
                </button>
            </form>

            <div id="loading" class="loading-spinner" style="display:none;">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">보드를 생성 중...</p>
            </div>
            <div id="error" class="error-message text-danger" style="display:none;"></div>
        </div>
    </section>
</div>

<footer>
    <p>&copy; 2025 Pedal App. Made with ❤️</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { getData, postData } from "/js/api.js";

    // DOM 요소 참조
    const form = document.getElementById("addBoardForm");
    const loadingEl = document.getElementById("loading");
    const errorEl = document.getElementById("error");
    const imageInput = document.getElementById("image");
    const imagePreviewContainer = document.getElementById("imagePreviewContainer");
    const imagePreview = document.getElementById("imagePreview");
    const previewText = document.getElementById("previewText");

    // 이미지 미리보기 및 드래그앤드롭 관련 함수
    function handleFile(file) {
        if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block';
                previewText.style.display = 'none';
            };
            reader.readAsDataURL(file);
        } else {
            imageInput.value = '';
            imagePreview.style.display = 'none';
            previewText.style.display = 'block';
            alert('이미지 파일만 업로드할 수 있습니다.');
        }
    }

    // 파일 선택(클릭) 이벤트
    imagePreviewContainer.addEventListener('click', () => {
        imageInput.click();
    });

    imageInput.addEventListener('change', (e) => {
        handleFile(e.target.files[0]);
    });

    // 드래그앤드롭 이벤트 리스너
    imagePreviewContainer.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
        imagePreviewContainer.classList.add('drag-over');
    });

    imagePreviewContainer.addEventListener('dragleave', (e) => {
        e.preventDefault();
        e.stopPropagation();
        imagePreviewContainer.classList.remove('drag-over');
    });

    imagePreviewContainer.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        imagePreviewContainer.classList.remove('drag-over');

        const files = e.dataTransfer.files;
        if (files.length > 0) {
            imageInput.files = files; // 드롭된 파일을 input 요소에 할당
            handleFile(files[0]);
        }
    });

    // 폼 제출 이벤트 리스너
    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // 폼 숨기기
        form.style.display = "none";
        // 로딩 상태 표시
        loadingEl.style.display = "block";
        errorEl.style.display = "none";

        const name = document.getElementById("name").value;
        const description = document.getElementById("description").value;
        const imageFile = imageInput.files[0];

        try {
            const {boardId} = await postData("/board/add", {name, description});

            if (imageFile) {
                const {uploadUrl, objectKey} = await postData(`/board/${boardId}/upload`);
                await fetch(uploadUrl, {
                    method: "PUT",
                    body: imageFile,
                    headers: {"Content-Type": imageFile.type}
                });
                await postData(`/board/${boardId}/upload/success`, {objectKey: objectKey});
            }

            window.location.href = `/board/${boardId}`;
        } catch (err) {
            console.error("보드 추가 실패:", err);
            errorEl.textContent = err.message || "보드 생성 중 오류가 발생했습니다.";
            errorEl.style.display = "block";
            loadingEl.style.display = "none";
            form.style.display = "block";
        }
    });

</script>
</body>
</html>
